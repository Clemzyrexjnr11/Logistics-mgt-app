<section
  class="signup bg-[#151515] h-[100%] w-full flex items-center justify-center"
>
  <div
    class="h-[600px] w-[500px] rounded-lg text-primary_tint flex flex-col items-center p-2 font-primary"
  >
    <p class="text-[16px] font-bold">New shipment</p>
    <p class="text-secondary mb-4">Fill in the pickup and delivery details.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmitForm()" class="w-full px-4">
      <div class="flex flex-col gap-2 mb-4">
        <label for="originAddress" class="font-secondary text-sm">Origin address</label>
        <input
          formControlName="originAddress"
          type="text"
          placeholder="pickup address"
          class="h-[45px] border-border border-[1px] bg-transparent rounded-lg px-2"
        />
      </div>
      <div class="flex flex-col gap-2 mb-4">
        <label for="destinationAddress" class="font-secondary text-sm">Destination address</label>
        <input
          formControlName="destinationAddress"
          type="text"
          placeholder="delivery address"
          class="h-[45px] border-border border-[1px] bg-transparent rounded-lg px-2"
        />
      </div>
      <div class="w-[100%] h-fit flex gap-2 mb-4">
      <div class="flex flex-col gap-2 mb-2 w-[50%]">
        <label for="recipientName" class="font-secondary text-sm">Recipient name</label>
        <input
          formControlName="recipientName"
          type="text"
          placeholder="full name"
          class="h-[45px] w-full border-border border-[1px] bg-transparent rounded-lg px-2"
        />
      </div>
      <div class="flex flex-col gap-2 mb-2 w-[50%]">
        <label for="recipientPhone" class="font-secondary text-sm">Recipient phone</label>
        <input
          formControlName="recipientPhone"
          type="text"
          placeholder="+234..."
          class="h-[45px] w-full border-border border-[1px] bg-transparent rounded-lg px-2"
        />
      </div>

      </div>
          <div class="flex flex-col gap-2 mb-4">
            <label
              for="packageType"
              class="font-secondary text-sm"
              >Package type</label
            >
            <select
              name="packageType"
              id=""
              formControlName="packageType"
              class="h-[40px] p-2 rounded-lg w-[100%] border-[1px] border-border outline-none  bg-transparent"
            >
              <option [value]="item.value" class="text-[#151515]" *ngFor="let item of packageType">
                {{ item.key }}
              </option>
            </select>
            </div>
      <div class="flex flex-col gap-2 mb-6">
        <label for="notes" class="font-secondary text-sm">Notes(optional)</label>
            <textarea
            name="notes"
            id=""
            rows="3"
            formControlName="notes"
            class="rounded-lg border-[1px] border-border outline-none w-[100%] p-2 bg-transparent"
          ></textarea>
      </div>
      <div class="w-full flex items-center gap-2">
        <button
          class="h-[40px] flex items-center justify-center rounded-lg text-[#151515] bg-transparent border-[1px] border-border w-full"
          type="button"
          (click)="dialogRef.close()"
          
        >
          <span class="text-white">Cancel</span>
        </button>
        <button
          class="h-[40px] flex items-center justify-center rounded-lg text-[#151515] bg-primary_tint w-full disabled:opacity-[0.7]"
          type="submit"
          [disabled]="!form.valid"
        >
        <mat-spinner diameter="20" *ngIf="isLoading" class=" mx-auto"></mat-spinner>
          <span *ngIf="!isLoading" class="text-[#151515]">Create shipment</span>
        </button>
      </div>
    </form>
  </div>
</section>
