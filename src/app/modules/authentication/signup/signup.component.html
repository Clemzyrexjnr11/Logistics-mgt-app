<section
  class="signup bg-[#151515] h-[100%] w-full flex items-center justify-center"
>
  <div
    class="h-[600px] w-[500px] rounded-lg text-primary_tint flex flex-col items-center py-4 font-primary"
  >
    <mat-icon>person_add</mat-icon>
    <p class="text-[30px] font-bold">Create your account</p>
    <p class="text-secondary mb-2">Start shipping in minutes</p>

    <form [formGroup]="form" (ngSubmit)="onSubmitForm()" class="w-full px-4">
      <div class="flex flex-col gap-2 mb-2">
        <label for="fullName">Full name</label>
        <input
          formControlName="fullName"
          type="text"
          class="h-[45px] border-border border-[1px] bg-transparent rounded-lg px-2"
        />
      </div>
      <div class="flex flex-col gap-2 mb-2">
        <label for="email">Email</label>
        <input
          formControlName="email"
          type="text"
          class="h-[45px] border-border border-[1px] bg-transparent rounded-lg px-2"
        />
      </div>
      <div class="flex flex-col gap-2 mb-3 relative">
        <label for="password">Password</label>
        <input
          formControlName="password"
          [type]="passwordVisible ? 'text' : 'password'"
          class="h-[45px] border-border border-[1px] bg-transparent rounded-lg px-2"
        />
        <button (click)="togglePasswordVisibility()">
          <mat-icon
            *ngIf="passwordVisible"
            style="position: absolute; top: 40px; right: 10px; font-size: 20px"
            >visibility_on</mat-icon
          >
          <mat-icon
            *ngIf="!passwordVisible"
            style="position: absolute; top: 40px; right: 10px; font-size: 20px"
            >visibility_off</mat-icon
          >
        </button>
      </div>
      <div class="flex flex-col gap-2 mb-6 relative">
        <label for="cpassword">Confirm Password</label>
        <input
          formControlName="cpassword"
          [type]="passwordVisible ? 'text' : 'password'"
          class="h-[45px] border-border border-[1px] bg-transparent rounded-lg px-2"
        />
        <button (click)="togglePasswordVisibility()">
          <mat-icon
            *ngIf="passwordVisible"
            style="position: absolute; top: 40px; right: 10px; font-size: 20px"
            >visibility_on</mat-icon
          >
          <mat-icon
            *ngIf="!passwordVisible"
            style="position: absolute; top: 40px; right: 10px; font-size: 20px"
            >visibility_off</mat-icon
          >
        </button>
      </div>
      <div class="flex flex-col justify-center items-center gap-2">
        <button
          class="h-[40px] flex items-center justify-center rounded-lg text-[#151515] bg-primary_tint w-full disabled:opacity-[0.7]"
          type="submit"
          [disabled]="!form.valid"
        >
          Create account
        </button>
        <p>
          Have an account?
          <a routerLink="/auth/login" class="text-primary_blue">Log in</a>
        </p>
      </div>
    </form>
  </div>
</section>
